<!DOCTYPE html>
<!--
  ЗАКРЫТАЯ СТРАНИЦА — 3D-дом с комнатами (стиль Doom/Wolfenstein), открывается после входа.

  ЧТО ЗДЕСЬ:
  - карта генерируется в браузере по фиксированному сиду (mulberry32) —
    один и тот же дом при каждом заходе;
  - 20 именованных комнат 7×7 клеток (не крестики-огрызки в лабиринте, а
    настоящие помещения), соединённые дверными проёмами — остовное дерево
    по всем комнатам плюс немного лишних дверей для развилок в маршруте.
    Никакой дом не уводит игрока в длинный путаный лабиринт — самый
    длинный переход намеренно один, и он же событие №4 ниже;
  - мебель — до 6 предметов на комнату, расставлена по периметру (20
    разных типов: диваны, кровати, шкафы, пианино, купель, алтарь,
    зеркала и т.д.), не залезает в дверные проёмы;
  - один предмет в каждой комнате — осматриваемый: подойди и нажми E,
    получишь короткую подсказку по сюжету (19 уникальных реплик);
  - при первом входе в комнату — короткая атмосферная строка (ещё 19);
  - 2 сюжетные развилки (какая из пары комнат встретится первой —
    гостиная/спальня и библиотека/молельня), от которых зависит финальная
    реплика у двери (4 варианта);
  - 8 срежиссированных событий: затемнение, силуэт в коридоре,
    заваливающийся за спиной проход, «бесконечный» коридор, обратный
    отсчёт шёпотом, повторяющееся мигание света, переставленная мебель
    при повторном визите, шаги позади при долгом бездействии —
    отдельно от 4 «пугающих» разрешений браузера;
  - HUD: подпись комнаты, полоса «пульса» (аналог здоровья), мини-камера;
  - кнопка выхода — не всплывающее окно, а физический объект в стене
    финальной комнаты: подойти и нажать E (или тапнуть на телефоне).

  ССЫЛКА НА ВЫХОДЕ: секрет VAULT_VIDEO, либо впиши прямо в EXIT_URL ниже.

  Разрешения (камера/микрофон/гео/уведомления) встроены в сюжет и служат
  ТОЛЬКО ДЛЯ ИСПУГА. Ничего не записывается и не отправляется — политика
  сайта (по умолчанию connect-src 'self') это запрещает. Всё живёт в
  браузере зрителя.
-->
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>—</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;background:#000;overflow:hidden;
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:#c9c9c9;}
  #view{display:block;width:100vw;height:100svh;background:#000;image-rendering:pixelated;cursor:crosshair;}

  .layer{position:fixed;inset:0;pointer-events:none;}
  #whisper{position:fixed;left:0;right:0;bottom:16%;text-align:center;
    font-size:clamp(14px,3.4vw,20px);letter-spacing:.12em;color:#e8e8e8;
    text-shadow:0 0 12px #000,0 0 26px rgba(176,20,20,.7);padding:0 20px;}
  #whisper.red{color:#e66;}

  /* ---------- HUD ---------- */
  #hud{position:fixed;inset:0;pointer-events:none;z-index:4;}
  #loc{position:fixed;top:14px;left:16px;font-size:11px;letter-spacing:.28em;
    text-transform:uppercase;color:#c9c9c9;opacity:0;transition:opacity .8s;
    text-shadow:0 0 10px #000;}
  #loc.show{opacity:.85;}

  #pulseWrap{position:fixed;top:14px;right:16px;width:120px;text-align:right;}
  #pulseLabel{font-size:9px;letter-spacing:.22em;color:#8a8a8a;margin-bottom:4px;text-transform:uppercase;}
  #pulseBar{width:100%;height:4px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);}
  #pulseFill{height:100%;width:0%;background:#8a2020;transition:width .6s linear, background .6s linear;}

  #cam{position:fixed;right:12px;bottom:12px;width:120px;height:90px;
    object-fit:cover;filter:grayscale(1) contrast(1.3) brightness(.7);
    border:1px solid rgba(176,20,20,.5);display:none;opacity:.75;
    animation:flick 3s steps(2) infinite;z-index:4;}
  @keyframes flick{0%,100%{opacity:.7;}50%{opacity:.85;}}

  #crosshair{position:fixed;left:50%;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;
    border-radius:50%;background:rgba(200,200,200,.5);z-index:4;}

  #interact{position:fixed;left:50%;bottom:30%;transform:translateX(-50%);
    font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#e66;
    text-shadow:0 0 10px #000;opacity:0;transition:opacity .3s;white-space:nowrap;z-index:4;}
  #interact.show{opacity:1;animation:glowtxt 1.4s ease-in-out infinite;}
  @keyframes glowtxt{0%,100%{opacity:.7;}50%{opacity:1;}}

  /* интро / финал */
  .screen{position:fixed;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:22px;text-align:center;
    background:#000;padding:24px;z-index:6;}
  .screen h1{font-size:clamp(20px,5vw,30px);letter-spacing:.24em;text-transform:uppercase;font-weight:600;}
  .screen p{font-size:13px;letter-spacing:.1em;color:#8a8a8a;line-height:1.8;max-width:520px;}
  .screen .kbd{color:#c9c9c9;}
  .btn{display:inline-block;padding:16px 34px;cursor:pointer;color:#c9c9c9;text-decoration:none;
    background:#0a0a0a;border:1px solid rgba(176,20,20,.5);border-radius:3px;
    font-family:inherit;font-size:13px;letter-spacing:.22em;text-transform:uppercase;
    animation:glow 2s ease-in-out infinite;}
  @keyframes glow{0%,100%{box-shadow:0 0 0 rgba(176,20,20,0);}50%{box-shadow:0 0 24px rgba(176,20,20,.5);}}
  .btn:hover{color:#fff;}

  /* сенсорные кнопки */
  #pad{position:fixed;left:0;right:0;bottom:0;display:none;justify-content:center;align-items:flex-end;gap:10px;
    padding:14px;z-index:5;}
  #pad button{width:68px;height:56px;background:rgba(10,10,10,.6);color:#c9c9c9;
    border:1px solid rgba(255,255,255,.12);border-radius:6px;font-size:20px;
    -webkit-user-select:none;user-select:none;touch-action:none;}
  #pad button[data-k="act"]{background:rgba(90,20,20,.5);border-color:rgba(230,102,102,.5);font-size:11px;letter-spacing:.1em;}
  @media (pointer:coarse){ #pad{display:flex;} }
</style>
</head>
<body>
  <canvas id="view"></canvas>
  <video id="cam" autoplay muted playsinline></video>
  <div id="whisper" class="layer"></div>

  <div id="hud">
    <div id="loc"></div>
    <div id="pulseWrap">
      <div id="pulseLabel">пульс</div>
      <div id="pulseBar"><div id="pulseFill"></div></div>
    </div>
    <div id="crosshair"></div>
    <div id="interact">[ E ] открыть</div>
  </div>

  <div id="pad">
    <button data-k="left">◄</button>
    <button data-k="fwd">▲</button>
    <button data-k="back">▼</button>
    <button data-k="right">►</button>
    <button data-k="act">E</button>
  </div>

  <div class="screen" id="intro">
    <h1>Ты внутри</h1>
    <p>{{TEXT}}</p>
    <p>дом больше, чем кажется снаружи. найди дверь.<br>
       <span class="kbd">W A S D</span> или стрелки — идти и поворачивать,
       <span class="kbd">E</span> — трогать то, что светится.<br>
       на телефоне — кнопки снизу.</p>
    <button class="btn" id="startBtn">войти в дом</button>
  </div>

<script>
/* ============================================================
   1. ГЕНЕРАЦИЯ ДОМА (детерминированная — один и тот же сид)
   Комнаты вместо лабиринта: 20 настоящих комнат 7×7, соединённых
   дверными проёмами (кратчайшее остовное дерево + немного лишних
   дверей для развилок), плюс один длинный коридор для события №4.
   ============================================================ */
function mulberry32(seed){
  return function(){
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const SEED = 133742;
const rnd = mulberry32(SEED);

const RCOLS=5, RROWS=4, STRIDE=8, INT=7;
const W = RCOLS*STRIDE+1, H = RROWS*STRIDE+1;
const GRID = Array.from({length:H}, () => Array(W).fill('#'));

const ROOM_NAMES = [
  'прихожая','гостиная','столовая','кухня','кладовая',
  'спальня','детская','ванная','кабинет','библиотека',
  'музыкальная комната','зимний сад','чулан','лестничная площадка','мансарда',
  'гардеробная','молельня','оранжерея','зеркальный зал','дверь'
];

const ROOM_LINES = [
  'дом внутри больше, чем казался снаружи.',
  'здесь кто-то недавно сидел.',
  'ужин никто не убрал.',
  'плита ещё тёплая.',
  'полки расставлены слишком аккуратно.',
  'в спальне душно, будто кто-то только что вышел.',
  'в детской никого нет. и не должно быть.',
  'капает кран. в доме нет труб для этого этажа.',
  'письма на столе не подписаны.',
  'книги стоят не по алфавиту. по чему-то другому.',
  'инструмент настроен. и недавно.',
  'растения тянутся не к окну.',
  'тут теснее, чем должно быть.',
  'лестница вниз короче, чем лестница наверх.',
  'здесь давно никто не убирался. кроме сегодняшнего дня.',
  'одежды больше, чем нужно одному человеку.',
  'здесь молились не тебе.',
  'стекло всё цело. а звук снаружи — нет.',
  'не задерживайся здесь взглядом.'
];

const EXAMINE_LINES = [
  'зеркало у входа. в нём на секунду — не ты.',
  'диван продавлен, будто кто-то только что встал.',
  'на столе тарелки. ещё тёплые.',
  'плита холодная. но пахнет ужином.',
  'в ящиках что-то шуршит без ветра.',
  'постель смята. подушка ещё хранит форму головы.',
  'колыбель качается сама.',
  'вода в ванне не двигается, хотя ты только вошёл.',
  'на столе раскрытый дневник. почерк меняется с каждой строкой.',
  'одна книга стоит вверх ногами. на всех полках. только эта.',
  'клавиша западает сама, тихо, будто на неё положили палец.',
  'листья мокрые. дождя здесь не бывает.',
  'пахнет пылью и чем-то ещё — сладким и неправильным.',
  'здесь холоднее, чем во всём доме.',
  'под простынёй — не мебель.',
  'одежда шевелится на сквозняке, которого нет.',
  'свечи горят, хотя ты их не зажигал.',
  'стекло всегда чуть запотевшее, будто кто-то дышит на него изнутри.',
  'зеркала здесь показывают комнату на секунду позже, чем ты в неё входишь.'
];

/* 20 комнат сеткой 5×4, интерьер 7×7 клеток каждая */
const rooms = [];
for(let j=0;j<RROWS;j++) for(let i=0;i<RCOLS;i++){
  const idx = j*RCOLS+i;
  const x0=i*STRIDE+1, x1=i*STRIDE+INT, y0=j*STRIDE+1, y1=j*STRIDE+INT;
  const cx=i*STRIDE+4, cy=j*STRIDE+4;
  rooms.push({idx,i,j,x0,x1,y0,y1,cx,cy,doors:[],visited:false,
    name:ROOM_NAMES[idx], line:ROOM_LINES[idx]||null});
  for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++) GRID[y][x]='.';
}

const allEdges = [];
for(let j=0;j<RROWS;j++) for(let i=0;i<RCOLS;i++){
  const a = j*RCOLS+i;
  if(i<RCOLS-1) allEdges.push({a, b:j*RCOLS+i+1, dir:'h'});
  if(j<RROWS-1) allEdges.push({a, b:(j+1)*RCOLS+i, dir:'v'});
}
const shuffledEdges = allEdges.slice();
for(let k=shuffledEdges.length-1;k>0;k--){ const l=(rnd()*(k+1))|0; [shuffledEdges[k],shuffledEdges[l]]=[shuffledEdges[l],shuffledEdges[k]]; }

const parent = Array.from({length:20},(_,k)=>k);
function find(x){ while(parent[x]!==x){ parent[x]=parent[parent[x]]; x=parent[x]; } return x; }
function union(a,b){ const ra=find(a), rb=find(b); if(ra===rb) return false; parent[ra]=rb; return true; }

function openDoor(edge){
  const ra=rooms[edge.a], rb=rooms[edge.b];
  if(edge.dir==='h'){
    const col=ra.x1+1, row=ra.cy;
    GRID[row][col]='.';
    ra.doors.push({side:'E', x:ra.x1, y:row});
    rb.doors.push({side:'W', x:rb.x0, y:row});
  } else {
    const row=ra.y1+1, col=ra.cx;
    GRID[row][col]='.';
    ra.doors.push({side:'S', x:col, y:ra.y1});
    rb.doors.push({side:'N', x:col, y:rb.y0});
  }
}
const usedEdges = new Set();
for(const e of shuffledEdges){ if(union(e.a,e.b)){ openDoor(e); usedEdges.add(e.a+'-'+e.b); } }
/* немного лишних дверей — чтобы дом не был строго линейным деревом */
for(const e of shuffledEdges){
  if(usedEdges.has(e.a+'-'+e.b)) continue;
  if(rnd()<0.35) openDoor(e);
}

/* длинный «невозможный» коридор — нижний ряд дома, для события №4 */
const CORR_Y = 3*STRIDE+4, CORR_X0 = 0*STRIDE+4, CORR_X1 = 4*STRIDE+4;
for(let x=CORR_X0; x<=CORR_X1; x++) GRID[CORR_Y][x]='.';

/* клетки рядом с дверьми — туда мебель не ставим */
const doorAdj = new Set();
for(const r of rooms){
  for(const d of r.doors){
    let ax=d.x, ay=d.y;
    if(d.side==='E') ax=r.x1;
    if(d.side==='W') ax=r.x0;
    if(d.side==='S') ay=r.y1;
    if(d.side==='N') ay=r.y0;
    doorAdj.add(ax+','+ay);
  }
}

/* мебель — по одной букве на тип, раскраска ниже в TINT */
const KITS = [
  ['M','C'],                   // 0  прихожая
  ['S','S','A','T','L','P'],   // 1  гостиная
  ['T','H','H','H','W'],       // 2  столовая
  ['K','K','F','T'],           // 3  кухня
  ['C','C','C','W'],           // 4  кладовая
  ['B','N','W','M'],           // 5  спальня
  ['R','C','H','P'],           // 6  детская
  ['V','M','N'],               // 7  ванная
  ['D','H','L','G'],           // 8  кабинет
  ['L','L','L','T','H'],       // 9  библиотека
  ['O','H','L'],                // 10 музыкальная комната
  ['P','P','P','U','H'],       // 11 зимний сад
  ['C','C','W'],                // 12 чулан
  ['T','M','P'],                // 13 лестничная площадка
  ['C','C','W','H'],           // 14 мансарда
  ['W','W','M','N'],           // 15 гардеробная
  ['Z','Z','H','H'],           // 16 молельня
  ['P','P','P','U'],           // 17 оранжерея
  ['M','M','M','M'],           // 18 зеркальный зал
  []                             // 19 дверь
];

function placeFurniture(room, kit){
  const cells=[];
  for(let x=room.x0;x<=room.x1;x++){ cells.push([x,room.y0]); cells.push([x,room.y1]); }
  for(let y=room.y0+1;y<room.y1;y++){ cells.push([room.x0,y]); cells.push([room.x1,y]); }
  const seen=new Set(); const uniq=[];
  for(const [x,y] of cells){ const k=x+','+y; if(!seen.has(k)){ seen.add(k); uniq.push([x,y]); } }
  for(let i=uniq.length-1;i>0;i--){ const j=(rnd()*(i+1))|0; [uniq[i],uniq[j]]=[uniq[j],uniq[i]]; }
  let ptr=0; const placed=[];
  for(const ch of kit){
    while(ptr<uniq.length){
      const [x,y]=uniq[ptr++]; const k=x+','+y;
      if(doorAdj.has(k)) continue;
      if(x===room.cx && y===room.cy) continue;
      if(GRID[y][x]==='.'){ GRID[y][x]=ch; placed.push({x,y,ch}); break; }
    }
  }
  return placed;
}

/* первый предмет мебели в каждой комнате — осматриваемый (клавиша E) */
const EXAMINE = []; // {x,y,text,fired}
rooms.forEach(room=>{
  const kit = KITS[room.idx];
  if(!kit.length) return;
  const placed = placeFurniture(room, kit);
  if(placed.length && EXAMINE_LINES[room.idx]){
    const p = placed[0];
    EXAMINE.push({x:p.x+0.5, y:p.y+0.5, text:EXAMINE_LINES[room.idx], fired:false});
  }
});

/* дверь наружу — светящаяся панель в стене финальной комнаты */
const START_ROOM = rooms[0], EXIT_ROOM = rooms[19];
const EXIT_PANEL = {x:EXIT_ROOM.cx, y:EXIT_ROOM.y0-1};
GRID[EXIT_PANEL.y][EXIT_PANEL.x] = 'X';
const EXIT = {x:EXIT_ROOM.cx+0.5, y:EXIT_ROOM.y0+0.5};
const START = {x:START_ROOM.cx+0.5, y:START_ROOM.cy+0.5};
const START_DIST = Math.hypot(EXIT.x-START.x, EXIT.y-START.y);

/* «пугающие» разрешения браузера — привязаны к комнатам по смыслу */
const TRIGGERS = [
  {room:18, type:'camera'},  // зеркальный зал
  {room:12, type:'mic'},     // чулан
  {room:16, type:'geo'},     // молельня
  {room:10, type:'notify'},  // музыкальная комната
].map(t => Object.assign({fired:false, x:rooms[t.room].cx+0.5, y:rooms[t.room].cy+0.5}, t));

/* две сюжетные развилки: какая из пары комнат встретится первой */
const BRANCH_A = {1:'тихо', 5:'спешишь'};              // гостиная vs спальня
const BRANCH_B = {9:'книжная', 16:'верующая'};          // библиотека vs молельня
let pathA = null, pathB = null;

/* ссылка выхода: секрет VAULT_VIDEO (через build.py) или впиши вручную */
let EXIT_URL = "";
const FROM_SECRET = "{{VIDEO_URL}}";
if (FROM_SECRET && FROM_SECRET.indexOf("{{") !== 0) EXIT_URL = FROM_SECRET;

/* ============================================================
   2. КАРТА: доступ к клеткам, раскраска мебели
   ============================================================ */
function cell(x,y){
  const xi=x|0, yi=y|0;
  if(xi<0||yi<0||xi>=W||yi>=H) return '#';
  return GRID[yi][xi] || '#';
}
function wall(x,y){ return cell(x,y) !== '.'; }
function canGo(x,y){ const r=0.22;
  return !wall(x-r,y-r)&&!wall(x+r,y-r)&&!wall(x-r,y+r)&&!wall(x+r,y+r); }

const TINT = {
  M:[170,190,210], C:[120,86,40],  S:[128,55,45],  A:[104,72,50],
  T:[96,74,50],    L:[86,52,30],   P:[46,92,54],   H:[118,92,62],
  W:[58,42,30],    K:[92,100,112], F:[176,180,186],B:[140,42,52],
  N:[104,78,54],   D:[76,58,40],   G:[58,118,96],  O:[24,22,26],
  R:[150,132,158], V:[158,170,182],Z:[196,158,64], U:[126,126,120]
};

/* ============================================================
   3. ИГРОК И КАМЕРА
   ============================================================ */
let px = START.x, py = START.y;
let ang = 0.0;
let dirX = Math.cos(ang), dirY = Math.sin(ang);
const FOV = 0.66;
let planeX = -dirY*FOV, planeY = dirX*FOV;

function move(dx,dy){ if(canGo(px+dx,py)) px+=dx; if(canGo(px,py+dy)) py+=dy; }
function rot(a){ const c=Math.cos(a), s=Math.sin(a);
  let x=dirX*c-dirY*s, y=dirX*s+dirY*c; dirX=x; dirY=y;
  let px2=planeX*c-planeY*s, py2=planeX*s+planeY*c; planeX=px2; planeY=py2; }

/* ============================================================
   4. ВВОД
   ============================================================ */
const K = {fwd:false,back:false,left:false,right:false};
const KEYMAP = {KeyW:'fwd',ArrowUp:'fwd',KeyS:'back',ArrowDown:'back',
             KeyA:'left',ArrowLeft:'left',KeyD:'right',ArrowRight:'right'};
let lastInputTs = performance.now();
addEventListener('keydown', e=>{
  if(KEYMAP[e.code]){ K[KEYMAP[e.code]]=true; lastInputTs=performance.now(); e.preventDefault(); }
  if(e.code==='KeyE' || e.code==='Space'){ interact(); lastInputTs=performance.now(); e.preventDefault(); }
});
addEventListener('keyup', e=>{ if(KEYMAP[e.code]) K[KEYMAP[e.code]]=false; });
document.querySelectorAll('#pad button').forEach(b=>{
  const k=b.dataset.k;
  if(k==='act'){ b.addEventListener('pointerdown', e=>{ e.preventDefault(); interact(); lastInputTs=performance.now(); }); return; }
  const on =e=>{e.preventDefault();K[k]=true;lastInputTs=performance.now();};
  const off=e=>{e.preventDefault();K[k]=false;};
  b.addEventListener('pointerdown',on); b.addEventListener('pointerup',off);
  b.addEventListener('pointerleave',off); b.addEventListener('pointercancel',off);
});
cv_click_setup();
function cv_click_setup(){
  const cv = document.getElementById('view');
  cv.addEventListener('click', ()=>{ if(cv.requestPointerLock) cv.requestPointerLock(); });
  addEventListener('mousemove', e=>{ if(document.pointerLockElement===cv){ rot(e.movementX*0.0025); lastInputTs=performance.now(); } });
}

/* ============================================================
   5. РЕНДЕР
   ============================================================ */
const cv = document.getElementById('view');
const ctx = cv.getContext('2d', {alpha:false});
let CW, CH;
function resize(){
  CW = cv.width  = Math.min(900, Math.floor(cv.clientWidth));
  CH = cv.height = Math.floor(cv.clientHeight * (CW / cv.clientWidth));
}
addEventListener('resize', resize);

const STEP = 2;
let zbuf = [];

function render(){
  if(performance.now() < blackoutUntil){
    ctx.fillStyle='#000'; ctx.fillRect(0,0,CW,CH);
    return;
  }
  ctx.fillStyle='#000'; ctx.fillRect(0,0,CW,CH/2);
  ctx.fillStyle='#080808'; ctx.fillRect(0,CH/2,CW,CH/2);
  zbuf = new Array(CW).fill(1e9);
  for(let x=0; x<CW; x+=STEP){
    const camX = 2*x/CW - 1;
    const rdx = dirX + planeX*camX, rdy = dirY + planeY*camX;
    let mx = px|0, my = py|0;
    const ddx = Math.abs(1/rdx), ddy = Math.abs(1/rdy);
    let sx, sy, stepX, stepY;
    if(rdx<0){stepX=-1; sx=(px-mx)*ddx;} else {stepX=1; sx=(mx+1-px)*ddx;}
    if(rdy<0){stepY=-1; sy=(py-my)*ddy;} else {stepY=1; sy=(my+1-py)*ddy;}
    let side=0, guard=0, ch='#';
    while(guard++<160){
      if(sx<sy){ sx+=ddx; mx+=stepX; side=0; } else { sy+=ddy; my+=stepY; side=1; }
      ch = cell(mx,my);
      if(ch!=='.') break;
    }
    let dist = side===0 ? (sx-ddx) : (sy-ddy);
    if(dist<0.0001) dist=0.0001;
    for(let s=0;s<STEP;s++){ if(x+s<CW) zbuf[x+s]=dist; }
    const lh = CH/dist;
    const y0 = (CH-lh)/2;
    let sh = Math.max(0, 1 - dist/13);

    if(ch==='X'){
      const pulse = 0.55 + 0.45*Math.sin(performance.now()/220);
      const c = Math.floor(150 + 90*pulse);
      ctx.fillStyle = 'rgb('+c+',30,30)';
    } else if(TINT[ch]){
      let [r,g,b] = TINT[ch];
      if(side===1){ r*=0.6; g*=0.6; b*=0.6; }
      ctx.fillStyle = 'rgb('+Math.floor(r*sh)+','+Math.floor(g*sh)+','+Math.floor(b*sh)+')';
    } else {
      let c = Math.floor(sh*255);
      if(side===1) c = Math.floor(c*0.6);
      ctx.fillStyle = 'rgb('+c+','+c+','+c+')';
    }
    ctx.fillRect(x, y0, STEP, lh);
  }
  drawSprites();
  vignette();
}

/* силуэт — простая тёмная фигура, никаких реалистичных изображений */
function drawSprites(){
  if(!figure.visible) return;
  const spriteX = figure.x-px, spriteY = figure.y-py;
  const invDet = 1.0/(planeX*dirY - dirX*planeY);
  const transformX = invDet*(dirY*spriteX - dirX*spriteY);
  const transformY = invDet*(-planeY*spriteX + planeX*spriteY);
  if(transformY <= 0.2) return;
  const screenX = Math.floor((CW/2)*(1+transformX/transformY));
  const height = Math.min(CH*2, Math.abs(Math.floor(CH/transformY)));
  const width = height*0.42;
  const y0 = Math.max(0, -height/2 + CH/2);
  const y1 = Math.min(CH, height/2 + CH/2);
  const x0 = Math.floor(-width/2 + screenX);
  const x1 = Math.floor(width/2 + screenX);
  for(let x=x0; x<x1; x+=STEP){
    if(x<0||x>=CW) continue;
    if(transformY >= zbuf[x]) continue;
    ctx.fillStyle = 'rgba(8,6,6,0.92)';
    ctx.fillRect(x, y0, STEP, y1-y0);
  }
  if(transformY < zbuf[Math.max(0,Math.min(CW-1,screenX))]){
    const eyeY = y0 + (y1-y0)*0.22;
    const eyeDX = width*0.14;
    ctx.fillStyle = 'rgba(200,40,40,.85)';
    ctx.fillRect(screenX-eyeDX-1, eyeY, 2, 2);
    ctx.fillRect(screenX+eyeDX-1, eyeY, 2, 2);
  }
}

let shake = 0;
function vignette(){
  let ox=0, oy=0;
  if(shake>0){ ox=(Math.random()-0.5)*shake*14; oy=(Math.random()-0.5)*shake*14; shake*=0.9; }
  const r0 = CH*(0.62 - 0.46*dread);
  const r1 = CH*0.8;
  const g = ctx.createRadialGradient(CW/2+ox, CH/2+oy, Math.max(1,r0), CW/2+ox, CH/2+oy, r1);
  g.addColorStop(0,'rgba(0,0,0,0)');
  g.addColorStop(1,'rgba(0,0,0,'+(0.55+0.45*dread).toFixed(3)+')');
  ctx.fillStyle=g; ctx.fillRect(0,0,CW,CH);
}

/* ============================================================
   6. НАГНЕТАНИЕ / HUD
   ============================================================ */
let dread = 0;
function updateDread(){
  const d = Math.hypot(EXIT.x-px, EXIT.y-py);
  const t = 1 - Math.min(1, d/START_DIST);
  dread += (t - dread) * 0.04;
  const fill = document.getElementById('pulseFill');
  fill.style.width = Math.round(dread*100)+'%';
  fill.style.background = dread>0.6 ? '#c93030' : '#8a2020';
}

const locEl = document.getElementById('loc');
const interactEl = document.getElementById('interact');
let lastRoom = -1, locTimer = null, revisitFired = false;
function checkRoom(){
  let nearest = -1, best = 5.5;
  for(const r of rooms){
    const d = Math.hypot(r.cx+0.5-px, r.cy+0.5-py);
    if(d<best){ best=d; nearest=r.idx; }
  }
  if(nearest>=0 && nearest!==lastRoom){
    lastRoom = nearest;
    const room = rooms[nearest];
    locEl.textContent = room.name;
    locEl.classList.add('show');
    clearTimeout(locTimer);
    locTimer = setTimeout(()=>locEl.classList.remove('show'), 2600);

    if(BRANCH_A[nearest] && !pathA){
      pathA = BRANCH_A[nearest];
      say(pathA==='тихо' ? 'ты идёшь тихо. это тоже слышно.' : 'ты спешишь. так быстрее не выйдет.', true);
    } else if(BRANCH_B[nearest] && !pathB){
      pathB = BRANCH_B[nearest];
      say(pathB==='книжная' ? 'ты читаешь даже здесь.' : 'ты всё ещё веришь, что это поможет.', true);
    } else if(!room.visited && room.line){
      say(room.line, false);
    } else if(room.visited && !revisitFired && nearest!==0 && nearest!==19){
      maybeRearrange(room);
    }
    room.visited = true;
  }
}

/* ============================================================
   7. ЗВУК
   ============================================================ */
let actx=null;
function initAudio(){
  try{
    actx = new (window.AudioContext||window.webkitAudioContext)();
    const g = actx.createGain(); g.gain.value=0; g.connect(actx.destination);
    [55,55.4,82.5].forEach(f=>{const o=actx.createOscillator();o.type='sine';o.frequency.value=f;o.connect(g);o.start();});
    g.gain.linearRampToValueAtTime(0.025, actx.currentTime+4);
  }catch(e){}
}
function thump(){
  if(!actx) return;
  const o=actx.createOscillator(), g=actx.createGain();
  o.type='sine'; o.frequency.setValueAtTime(90, actx.currentTime);
  o.frequency.exponentialRampToValueAtTime(38, actx.currentTime+0.14);
  g.gain.setValueAtTime(0.0001, actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.5, actx.currentTime+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime+0.3);
  o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime+0.32);
}
function creak(){
  if(!actx) return;
  const o=actx.createOscillator(), g=actx.createGain();
  o.type='sawtooth'; o.frequency.setValueAtTime(70, actx.currentTime);
  o.frequency.exponentialRampToValueAtTime(20, actx.currentTime+0.9);
  g.gain.setValueAtTime(0.0001, actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.12, actx.currentTime+0.05);
  g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime+0.9);
  o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime+0.95);
}
function step(){
  if(!actx) return;
  const o=actx.createOscillator(), g=actx.createGain();
  o.type='square'; o.frequency.setValueAtTime(140, actx.currentTime);
  g.gain.setValueAtTime(0.0001, actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.06, actx.currentTime+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime+0.12);
  o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime+0.13);
}
function heartbeat(){
  if(!running) return;
  thump(); setTimeout(thump, 190);
  const interval = 1150 - dread*760;
  setTimeout(heartbeat, Math.max(360, interval));
}

/* ============================================================
   8. СООБЩЕНИЯ
   ============================================================ */
const wEl = document.getElementById('whisper');
let queue=[], busy=false;
function say(text, red){ return new Promise(res=>{ queue.push({text,red,res}); pump(); }); }
async function pump(){
  if(busy) return; busy=true;
  while(queue.length){
    const m=queue.shift();
    wEl.className = m.red ? 'layer red' : 'layer';
    wEl.textContent='';
    for(let i=0;i<m.text.length;i++){ wEl.textContent=m.text.slice(0,i+1); await sleep(30); }
    await sleep(1600); m.res&&m.res();
  }
  wEl.textContent=''; busy=false;
}
const sleep = ms => new Promise(r=>setTimeout(r,ms));

/* ============================================================
   9. РАЗРЕШЕНИЯ БРАУЗЕРА — только испуг, ничего никуда не уходит
   ============================================================ */
async function fireTrigger(type){
  if(type==='camera'){
    await say('дай посмотреть на тебя.');
    try{
      const st = await navigator.mediaDevices.getUserMedia({video:true});
      const el=document.getElementById('cam'); el.srcObject=st; el.style.display='block';
      await say('вот, значит, ты какой.', true);
    }catch(e){ await say('спрятал лицо. я уже запомнил.', true); }
  }
  else if(type==='mic'){
    await say('тише. я слушаю.');
    try{
      const st = await navigator.mediaDevices.getUserMedia({audio:true});
      const ac = actx || new (window.AudioContext||window.webkitAudioContext)();
      const src = ac.createMediaStreamSource(st);
      const an = ac.createAnalyser(); an.fftSize=256; src.connect(an);
      const buf = new Uint8Array(an.frequencyBinCount);
      (function loop(){ an.getByteFrequencyData(buf);
        let s=0; for(const v of buf) s+=v; const avg=s/buf.length;
        if(avg>55) shake=Math.min(1, avg/120);
        if(running) requestAnimationFrame(loop);
      })();
      await say('слышу, как ты дышишь.', true);
    }catch(e){ await say('молчишь. тишина не спрячет.', true); }
  }
  else if(type==='geo'){
    await say('а где ты на самом деле?');
    if(!navigator.geolocation){ await say('...и так найду.', true); return; }
    navigator.geolocation.getCurrentPosition(
      async p=>{ await say('ты здесь: '+p.coords.latitude.toFixed(3)+', '+p.coords.longitude.toFixed(3)+'. теперь навсегда.', true); },
      async ()=>{ await say('не хочешь говорить. найду сам.', true); },
      {timeout:8000});
  }
  else if(type==='notify'){
    await say('я позову, когда придёт время.');
    if(!('Notification' in window)){ return; }
    try{
      const p = await Notification.requestPermission();
      if(p==='granted'){ setTimeout(()=>{ try{ new Notification('не оборачивайся.'); }catch(e){} }, 9000);
        await say('хорошо.', true); }
      else { await say('всё равно услышишь.', true); }
    }catch(e){}
  }
}
function checkTriggers(){
  for(const t of TRIGGERS){
    if(!t.fired && Math.hypot(t.x-px, t.y-py) < 1.4){ t.fired=true; fireTrigger(t.type); }
  }
}

/* осматриваемая мебель — клавиша E рядом с помеченным предметом */
function nearExamine(){
  for(const e of EXAMINE){
    if(!e.fired && Math.hypot(e.x-px, e.y-py) < 0.9) return e;
  }
  return null;
}

/* ============================================================
   10. ВОСЕМЬ СОБЫТИЙ
   ============================================================ */

/* 10.1 затемнение на секунду с частым сердцебиением */
let blackoutUntil = 0, blackoutFired = false;
function maybeBlackout(){
  if(!blackoutFired && dread>=0.35){
    blackoutFired = true;
    blackoutUntil = performance.now()+1100;
    thump(); setTimeout(thump,150); setTimeout(thump,300);
    say('не смотри.', true);
  }
}

/* 10.2 силуэт в конце коридора на пару секунд */
const figure = {x:0,y:0,visible:false,until:0};
let figureFired = false;
function maybeFigure(){
  if(!figureFired && dread>=0.55){
    figureFired = true;
    for(const dist of [5,4,3,2]){
      const sx=px+dirX*dist, sy=py+dirY*dist;
      if(!wall(sx,sy)){ figure.x=sx; figure.y=sy; figure.visible=true; figure.until=performance.now()+2600; break; }
    }
    if(figure.visible) say('не оборачивайся.', true);
  }
  if(figure.visible && performance.now()>figure.until) figure.visible=false;
}

/* 10.3 путь позади заваливается — один раз, только вход в дом */
let sealed = false;
function maybeSeal(){
  if(!sealed && Math.hypot(px-START.x, py-START.y) > 4){
    sealed = true;
    for(const d of START_ROOM.doors){
      let x=d.x, y=d.y;
      if(d.side==='E') x=START_ROOM.x1+1;
      if(d.side==='W') x=START_ROOM.x0-1;
      if(d.side==='S') y=START_ROOM.y1+1;
      if(d.side==='N') y=START_ROOM.y0-1;
      if(GRID[y] && GRID[y][x]==='.'){ GRID[y][x]='#'; break; }
    }
    creak();
    say('то, что было позади, больше не пройти.', true);
  }
}

/* 10.4 «бесконечный» коридор — идёшь вперёд, а он не кончается */
const LOOP = {active:true, loopsLeft:3, inBand:false, originX:0};
function maybeLoop(){
  const inBand = Math.abs(py-(CORR_Y+0.5)) < 0.4 && px>CORR_X0 && px<CORR_X1;
  if(inBand && !LOOP.inBand){ LOOP.inBand=true; LOOP.originX=px; }
  if(!inBand){ LOOP.inBand=false; return; }
  if(!LOOP.active) return;
  const traveled = px - LOOP.originX;
  if(Math.abs(traveled) > 6){
    px = LOOP.originX + Math.sign(traveled)*0.6;
    LOOP.originX = px;
    LOOP.loopsLeft--;
    shake = 0.7; thump();
    if(LOOP.loopsLeft>0){ say('этот коридор длиннее, чем должен быть.', true); }
    else { LOOP.active=false; say('...наконец.', true); }
  }
}

/* 10.5 обратный отсчёт шёпотом по мере приближения к двери */
const COUNTDOWN = [
  {t:0.50, msg:'ты близко.', fired:false},
  {t:0.65, msg:'совсем рядом.', fired:false},
  {t:0.80, msg:'я тоже.', fired:false},
  {t:0.92, msg:'обернись.', fired:false},
];
function maybeCountdown(){
  for(const c of COUNTDOWN){ if(!c.fired && dread>=c.t){ c.fired=true; say(c.msg, true); } }
}

/* 10.6 мигающий свет — короткое затемнение, повторяется несколько раз */
let flickerLeft = 3, flickerNext = 14000;
function maybeFlicker(ts){
  if(flickerLeft<=0 || dread<0.3) return;
  if(ts < flickerNext) return;
  flickerLeft--; flickerNext = ts + 9000 + rnd()*6000;
  blackoutUntil = performance.now()+180;
  creak();
}

/* 10.7 переставленная мебель — при повторном входе в комнату, один раз за игру */
function maybeRearrange(room){
  revisitFired = true;
  const kit = KITS[room.idx];
  if(!kit || !kit.length) return;
  for(let y=room.y0;y<=room.y1;y++){
    for(let x=room.x0;x<=room.x1;x++){
      const c = GRID[y][x];
      if(TINT[c]){
        GRID[y][x] = kit[(rnd()*kit.length)|0];
        say('тут было не так.', true);
        creak();
        return;
      }
    }
  }
}

/* 10.8 шаги позади — если долго стоять на месте */
let lastStepTs = 0;
function maybeFootsteps(ts){
  const idle = ts - lastInputTs;
  if(idle > 2600 && ts - lastStepTs > 6000 && dread>0.2){
    lastStepTs = ts;
    step(); setTimeout(step, 260); setTimeout(step, 520);
    say('шаги. не твои.', true);
  }
}

/* ============================================================
   11. ВЫХОД — физический объект, не всплывающее окно
   ============================================================ */
let lastInteract = 0;
function nearExit(){ return Math.hypot(EXIT.x-px, EXIT.y-py) < 1.6; }
function interact(){
  const ex = nearExamine();
  if(ex){ ex.fired=true; say(ex.text, false); return; }
  if(!nearExit()) return;
  const now = performance.now();
  if(now-lastInteract < 1200) return;
  lastInteract = now;
  if(EXIT_URL){
    window.open(EXIT_URL, '_blank', 'noopener,noreferrer');
    const key = (pathA||'?')+'/'+(pathB||'?');
    const LINES = {
      'тихо/книжная':'тихие и внимательные — редкость. дверь открыта для таких.',
      'тихо/верующая':'ты молчал и верил. этого хватило.',
      'спешишь/книжная':'ты бежал, но успел прочитать. почти достаточно.',
      'спешишь/верующая':'ты спешил и молился. дверь открылась не поэтому — а потому что открылась.'
    };
    say(LINES[key] || 'дверь открыта.', true);
  } else {
    say('тут нечего открыть.', true);
  }
}

/* ============================================================
   12. ЦИКЛ
   ============================================================ */
let running=false, last=0;
function loop(ts){
  if(!running) return;
  const dt = Math.min(0.05, (ts-last)/1000 || 0.016); last=ts;
  const spd = 2.7*dt, r = 2.3*dt;
  if(K.fwd)  move(dirX*spd, dirY*spd);
  if(K.back) move(-dirX*spd, -dirY*spd);
  if(K.left) rot(-r);
  if(K.right) rot(r);
  updateDread(); checkTriggers(); checkRoom();
  maybeBlackout(); maybeFigure(); maybeSeal(); maybeLoop(); maybeCountdown();
  maybeFlicker(ts); maybeFootsteps(ts);
  render();
  const ex = nearExamine();
  interactEl.textContent = ex ? '[ E ] осмотреть' : '[ E ] открыть';
  interactEl.classList.toggle('show', !!ex || nearExit());
  requestAnimationFrame(loop);
}

document.getElementById('startBtn').addEventListener('click', function(){
  document.getElementById('intro').style.display='none';
  resize(); initAudio(); heartbeat();
  running=true; last=performance.now(); lastInputTs=performance.now(); requestAnimationFrame(loop);
});

/* заголовок вкладки, если отвлёкся */
const rt=document.title;
document.addEventListener('visibilitychange', ()=>{
  document.title = document.hidden ? 'не оборачивайся.' : rt;
});
resize();

</script>
