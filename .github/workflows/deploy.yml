name: Сборка и публикация

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install "cryptography>=42,<47"

      - name: Собрать сайт из секретов
        run: python build.py
        env:
          SITE_LOGIN:     ${{ secrets.SITE_LOGIN }}
          SITE_PASSWORD:  ${{ secrets.SITE_PASSWORD }}
          RECOVERY_VIDEO: ${{ secrets.RECOVERY_VIDEO }}
          VAULT_HTML:     ${{ secrets.VAULT_HTML }}
          VAULT_VIDEO:    ${{ secrets.VAULT_VIDEO }}
          VAULT_TEXT:     ${{ secrets.VAULT_TEXT }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
